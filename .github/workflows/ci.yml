name: CI

# Every branch on push, and every PR into main. The "backend" and "frontend" checks are
# required by main's branch protection: a red check blocks the merge (misión 2026-11-22-ci-bloqueo).
on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      # Same as production: railpack.json pins Python 3.13 and installs backend/requirements.txt
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies (as railpack.json)
        run: pip install --no-cache-dir -r requirements.txt

      - name: Tests
        run: python -m pytest

      - name: Alembic has exactly one head
        run: |
          heads="$(python -m alembic heads)"
          echo "$heads"
          count="$(printf '%s\n' "$heads" | grep -c '(head)' || true)"
          if [ "$count" -ne 1 ]; then
            echo "::error::alembic heads = $count (must be exactly 1)"
            exit 1
          fi

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      # Same as production: the Vercel project (corex-web) builds on Node 24.x
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Tests
        run: npx vitest run

      - name: Lint
        run: npx eslint src --ext .ts,.tsx --max-warnings 0

      - name: Build (typecheck + bundle)
        run: npm run build
