# Railway build for the backend once its Root Directory is the REPO ROOT (needed so the remote
# MCP, backend/mcp_remote.py, can import mcp/korex_mcp.py). Only Python: the root package.json
# must not make Nixpacks build a Node app. While Railway's Root Directory is still backend/,
# this file is outside the build and is ignored (backend/Procfile keeps running the service).
providers = ["python"]

[variables]
NIXPACKS_PYTHON_VERSION = "3.12"  # the version CI (.github/workflows/ci.yml) and local dev test with
PYTHONUNBUFFERED = "1"

[phases.install]
cmds = ["python -m venv /opt/venv && . /opt/venv/bin/activate && pip install -r backend/requirements.txt"]
paths = ["/opt/venv/bin"]

[start]
cmd = "cd backend && alembic upgrade head && uvicorn main:app --host 0.0.0.0 --port $PORT"
