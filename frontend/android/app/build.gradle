apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'

// Google Play upload key (Play App Signing): read from a LOCAL, never-committed keystore.properties
// (see ../keystore.properties.example). Path: $KOREX_KEYSTORE_PROPERTIES, else android/keystore.properties.
def uploadKeyProps = new Properties()
def uploadKeyFile = System.getenv('KOREX_KEYSTORE_PROPERTIES') ? file(System.getenv('KOREX_KEYSTORE_PROPERTIES')) : rootProject.file('keystore.properties')
if (uploadKeyFile.exists()) {
    uploadKeyFile.withInputStream { uploadKeyProps.load(it) }
}
// Only a Play build (-PplayUpload) signs with the upload key; the sideloaded APKs keep the debug key
def playUpload = project.hasProperty('playUpload')
if (playUpload && !uploadKeyFile.exists()) {
    throw new GradleException("-PplayUpload needs keystore.properties (set KOREX_KEYSTORE_PROPERTIES or create android/keystore.properties)")
}

android {
    namespace = "com.korexf.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.korexf.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 8
        versionName "1.0.7"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (uploadKeyFile.exists()) {
                storeFile file(uploadKeyProps['storeFile'])
                storePassword uploadKeyProps['storePassword']
                keyAlias uploadKeyProps['keyAlias']
                keyPassword uploadKeyProps['keyPassword']
            }
        }
    }
    buildTypes {
        release {
            // Sideloaded APKs: v1 was signed with the machine's ~/.android/debug.keystore and every
            // APK must keep the SAME key or Android forces an uninstall. The Play bundle
            // (./gradlew bundleRelease -PplayUpload) is signed with the upload key instead.
            signingConfig playUpload ? signingConfigs.release : signingConfigs.debug
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
    // Google Play Billing (own plugin, no intermediaries): latest stable 8.x
    implementation "com.android.billingclient:billing:8.3.0"
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}

kotlin {
    // same bytecode level as capacitor.build.gradle's compileOptions (Java 21)
    jvmToolchain(21)
}
